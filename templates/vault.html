<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Vault — DocVault</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="page"><header class="brand"><img src="{{ url_for('static', filename='logo.svg') }}"><div><h1>My Vault</h1><p>private to this browser</p></div></header><section class="card"><h3>Add a document</h3><form id="form"><div class="form-row"><label>Document name</label><input id="name" maxlength="60" placeholder="e.g. My CNIC" required></div><div class="form-row"><label>Document type</label><select id="type" required><option value="">Choose type</option><option>CNIC</option><option>Passport</option><option>B-Form</option><option>Driving License</option><option>Vehicle Card</option></select></div><div class="form-row"><label>Expiry date</label><input id="expiry" type="date" required></div><button class="primary">Save to My Vault</button></form></section><section class="card"><h3>My documents</h3><div id="docs"></div></section><section class="card"><h3>Backup & restore</h3><p class="small">Your vault stays in this browser. Export a backup before clearing browser data or changing devices.</p><div class="toolbar"><button class="secondary" id="export">Export backup</button><button class="secondary" id="import">Restore backup</button></div><input id="file" type="file" accept=".json,application/json" hidden></section></main><nav class="nav"><a href="/">Home</a><a class="active" href="/vault">My Vault</a></nav><script>const KEY='docvault_documents';let docs=JSON.parse(localStorage.getItem(KEY)||'[]');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function diff(x){const a=new Date();a.setHours(0,0,0,0);return Math.ceil((new Date(x+'T00:00:00')-a)/86400000)}function fmt(x){return new Date(x+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}function save(){localStorage.setItem(KEY,JSON.stringify(docs));render()}function render(){const b=document.getElementById('docs');if(!docs.length){b.innerHTML='<div class="empty">No documents yet.<br>Add your first document above.</div>';return}docs.sort((a,b)=>a.expiry.localeCompare(b.expiry));b.innerHTML=docs.map((d,i)=>{const n=diff(d.expiry);const st=n<0?`Expired ${Math.abs(n)} ${Math.abs(n)==1?'day':'days'} ago`:n==0?'Expires today':`Will expire in ${n} ${n==1?'day':'days'}`;const cl=n<0?'expired':n<=30?'soon':'';return `<article class="doc"><div class="doc-top"><div><div class="doc-name">${esc(d.name)}</div><div class="doc-type">${esc(d.type)}</div></div><span class="status ${cl}">${st}</span></div><div class="doc-date">Expiry: ${fmt(d.expiry)}</div><div class="actions"><button class="secondary" onclick="office(${i})">📍 Find office</button><button class="danger" onclick="removeDoc(${i})">Delete</button></div></article>`}).join('')}document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();docs.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name:name.value.trim(),type:type.value,expiry:expiry.value});save();e.target.reset()});function removeDoc(i){if(confirm('Delete this document from your browser vault?')){docs.splice(i,1);save()}}async function office(i){let u='/api/office-search?type='+encodeURIComponent(docs[i].type);const open=x=>fetch(x).then(r=>r.json()).then(z=>window.open(z.maps_url,'_blank'));if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>open(u+'&lat='+p.coords.latitude+'&lon='+p.coords.longitude),()=>open(u))}else open(u)}document.getElementById('export').onclick=()=>{const b=new Blob([JSON.stringify(docs,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='docvault-backup.json';a.click();URL.revokeObjectURL(a.href)};document.getElementById('import').onclick=()=>file.click();file.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x)||!x.every(d=>d&&typeof d.name==='string'&&typeof d.type==='string'&&typeof d.expiry==='string'))throw 0;docs=x;save();alert('Backup restored.')}catch{alert('That backup file is not valid.')}};r.readAsText(f);e.target.value=''};render();</script></body></html>
